[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfta"
version = "0.1.0"
description = "Stubble fire timing shift vs Delhi PM2.5 analytics"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "shapely>=2",
    "requests",
    "python-dotenv",
    "pyyaml",
    "scipy",
    "statsmodels",
    "matplotlib",
    "xarray",
    "h5netcdf",
    "h5py",
    "cdsapi>=0.7",
    "earthengine-api",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
